name: Format Check

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: "format: Check JuliaFormatter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'import Pkg; Pkg.add("JuliaFormatter")'
      - name: Check formatting
        id: check
        run: |
          julia -e '
            using JuliaFormatter
            ver = string(pkgversion(JuliaFormatter))
            println("JuliaFormatter version: ", ver)
            bad = String[]
            for (root, dirs, files) in walkdir(".")
              root == joinpath(".", ".git") && continue
              startswith(root, joinpath(".", ".git", "")) && continue
              for f in files
                path = joinpath(root, f)
                endswith(path, ".jl") || continue
                try
                  format(path, BlueStyle(); overwrite=false) || push!(bad, path)
                catch
                end
              end
            end
            if !isempty(bad)
              println("The following files need formatting:")
              for p in bad; println("  ", p); end
              write("format_comment.md", join([
                "### Formatting issues",
                "",
                "Thank you for contributing! The following files need formatting:",
                "",
                join(["- `" * p * "`" for p in bad], "\n"),
                "",
                "To fix, run the following from the repository root using " *
                "JuliaFormatter v$(ver) (the exact version this check uses):",
                "",
                "```bash",
                "cd <your-local-clone>",
                "julia -e '\''import Pkg; Pkg.add(PackageSpec(name=\"JuliaFormatter\", version=\"$(ver)\"))'\''",
                "julia -e '\''using JuliaFormatter; format(\".\", BlueStyle())'\''",
                "```",
                "",
                "Then commit and push the changes.",
              ], "\n"))
              exit(1)
            else
              write("format_comment.md", "### Formatting check passed\n\nThank you for contributing! All files are correctly formatted (JuliaFormatter v$(ver), BlueStyle).")
            end
          '

      - name: Post formatting comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('format_comment.md', 'utf8');
            const tagged = body + '\n\n<!-- auto-pr-comment: formatting -->';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Find this checker's own previous comment (newest first), not the
            // last comment overall, so the JET checker's comment is ignored.
            const myTag = '<!-- auto-pr-comment: formatting -->';
            const existing = comments.data
              .slice()
              .reverse()
              .find(c => c.body && c.body.includes(myTag));

            if (existing) {
              if (existing.body === tagged) {
                console.log('Comment unchanged — skipping.');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: tagged,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: tagged,
              });
            }
