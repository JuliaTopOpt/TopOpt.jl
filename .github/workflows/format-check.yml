name: Format Check

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: "format: Check JuliaFormatter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'import Pkg; Pkg.add("JuliaFormatter")'
      - name: Check formatting
        run: |
          julia -e '
            using JuliaFormatter
            needs_formatting = format(".", BlueStyle(); dry=true)
            if needs_formatting
              error("Code is not formatted. Run the following locally and commit the changes:\n  julia -e '\''using JuliaFormatter; format(\".\", BlueStyle())'\''")
            end
          '
