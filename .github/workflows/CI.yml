name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
jobs:
  precompile:
    name: Precompile (${{ matrix.cache-name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cache-name: test
            prefs: ''
          - cache-name: test-opposite
            prefs: 'opposite'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - name: Instantiate and precompile test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=".")); Pkg.instantiate(); Pkg.precompile()'
      - name: Set opposite preference and recompile TopOpt
        if: matrix.prefs == 'opposite'
        run: |
          julia --project=test -e '
            using Preferences
            Preferences.set_preferences!(
              (Base.UUID("a6e80f52-281a-4a51-a3c5-60a2513022d0"), "TopOpt"),
              "penalty_before_interpolation" => "false";
              force=true
            )
          '
          julia --project=test -e 'using TopOpt'
      - name: Pack Julia depot
        run: tar czf /tmp/depot.tar.gz -C ~ .julia
      - name: Upload depot
        uses: actions/upload-artifact@v4
        with:
          name: depot-${{ matrix.cache-name }}
          path: /tmp/depot.tar.gz
          retention-days: 1
  test:
    name: ${{matrix.group}} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    needs: precompile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        group:
          - Core_Tests
          - Examples_1
          - Examples_2
          - Examples_3
          - Examples_4
          - Examples_5
          - Examples_6
          - Examples_7
          - Examples_8
          - Examples_9
          - Examples_10
          - WCSMO14_1
          - WCSMO14_2
          - Core_Tests_Opposite_Preference
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Download depot
        uses: actions/download-artifact@v4
        with:
          name: depot-${{ contains(matrix.group, 'Opposite_Preference') && 'test-opposite' || 'test' }}
          path: /tmp
      - name: Unpack Julia depot
        run: tar xzf /tmp/depot.tar.gz -C ~
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=".")); Pkg.instantiate(); Pkg.precompile()'
      - name: Set preference for opposite preference jobs
        if: contains(matrix.group, 'Opposite_Preference')
        run: |
          julia --project=test -e '
            using Preferences
            Preferences.set_preferences!(
              (Base.UUID("a6e80f52-281a-4a51-a3c5-60a2513022d0"), "TopOpt"),
              "penalty_before_interpolation" => "false";
              force=true
            )
            println("Set penalty_before_interpolation to false")
          '
      - name: Run tests
        env:
          GROUP: ${{ matrix.group }}
          DOCS_OUTPUT_DIR: ${{ contains(matrix.group, 'Examples') && format('{0}/docs-generated', runner.temp) || '' }}
        run: julia --project=test --color=yes --check-bounds=yes --depwarn=yes --code-coverage=@. -e 'include("test/runtests.jl")'
      - name: Upload generated docs examples
        if: contains(matrix.group, 'Examples')
        uses: actions/upload-artifact@v4
        with:
          name: docs-examples-${{ matrix.group }}
          path: ${{ runner.temp }}/docs-generated/
          if-no-files-found: warn
          retention-days: 1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: docs (build & deploy)
    needs: test
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Download depot
        uses: actions/download-artifact@v4
        with:
          name: depot-test
          path: /tmp
      - name: Unpack Julia depot
        run: tar xzf /tmp/depot.tar.gz -C ~
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      - name: Download generated examples
        uses: actions/download-artifact@v4
        with:
          pattern: docs-examples-Examples_*
          merge-multiple: true
          path: docs/src/examples
      - name: Copy static images
        run: julia --project=docs -e 'include("docs/generate.jl"); copy_static_images(EXAMPLE_DIR, GENERATED_DIR)'
        env:
          DOCS_SKIP_GENERATE: 'true'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCS_SKIP_GENERATE: 'true'
        run: julia --project=docs --color=yes docs/make.jl