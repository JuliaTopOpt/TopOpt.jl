name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scan for tutorial .qmd files (outputs list for dynamic matrix)
  scan-tutorials:
    name: "scan: Tutorial files"
    runs-on: ubuntu-latest
    outputs:
      tutorial-list: ${{ steps.scan.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - name: Scan .qmd files
        id: scan
        run: |
          LIST=$(find docs/tutorials -maxdepth 1 -name '*.qmd' \
                 | xargs -n1 basename | sed 's/\.qmd$//' \
                 | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$LIST" >> $GITHUB_OUTPUT

  test:
    name: "test: ${{matrix.group}}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        group:
          - Core_Tests
          - WCSMO14_1
          - WCSMO14_2
          - Core_Tests_Opposite_Preference
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: ${{ contains(matrix.group, 'Opposite_Preference') && 'test-opposite' || 'test' }}
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Set preference for opposite preference jobs
        if: contains(matrix.group, 'Opposite_Preference')
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.develop(PackageSpec(path="."))
            Pkg.instantiate()
            using Preferences
            Preferences.set_preferences!(
              (Base.UUID("a6e80f52-281a-4a51-a3c5-60a2513022d0"), "TopOpt"),
              "penalty_before_interpolation" => "false";
              force=true
            )
            println("Set penalty_before_interpolation to false")
          '
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=".")); Pkg.instantiate(); Pkg.precompile()'
      - name: Run tests
        env:
          GROUP: ${{ matrix.group }}
        run: julia --project=test --color=yes --check-bounds=yes --depwarn=yes --code-coverage=@. -e 'include("test/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # One CI job per tutorial .qmd file (dynamic matrix from scan-tutorials)
  tutorials:
    name: "tutorial: ${{ matrix.tutorial }}"
    needs: scan-tutorials
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tutorial: ${{ fromJSON(needs.scan-tutorials.outputs.tutorial-list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
        with:
          cache-name: tutorials-${{ hashFiles('Project.toml') }}
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install tutorial dependencies
        run: |
          julia --project=docs/tutorials -e '
            using Pkg
            Pkg.develop(PackageSpec(path="."))
            Pkg.instantiate()
            Pkg.precompile()'
      - name: Render tutorial with Quarto
        working-directory: docs/tutorials
        env:
          JULIA_PROJECT: ${{ github.workspace }}/docs/tutorials
        run: quarto render ${{ matrix.tutorial }}.qmd --execute
      - name: Upload rendered tutorial
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.tutorial }}
          path: docs/tutorials/_site/${{ matrix.tutorial }}.html
          retention-days: 1

  # Build main docs site (parallel to tutorials, doesn't wait for them)
  docs-build:
    name: "docs: Build main docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: docs-${{ hashFiles('Project.toml') }}
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      - name: Build docs with Documenter
        run: julia --project=docs --color=yes docs/make.jl
      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/
          retention-days: 1

  # Assemble final site from docs and tutorials artifacts
  assemble-site:
    name: "assemble: Final site"
    needs: [tutorials, docs-build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/
      - name: Download rendered tutorials
        uses: actions/download-artifact@v4
        with:
          pattern: tutorial-*
          merge-multiple: true
          path: docs/tutorials/_site
      - name: Copy tutorials into docs build
        run: |
          mkdir -p docs/build/tutorials
          cp docs/tutorials/_site/*.html docs/build/tutorials/
          echo "Copied $(ls docs/build/tutorials/*.html | wc -l) tutorial HTML files"
      - name: Upload final site
        uses: actions/upload-artifact@v4
        with:
          name: final-site
          path: docs/build/
          retention-days: 7

  # Deploy dev docs to GitHub Pages (on push to master)
  deploy-dev:
    name: "deploy: Dev docs"
    needs: assemble-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download final site
        uses: actions/download-artifact@v4
        with:
          name: final-site
          path: docs/build/
      - name: Deploy to GitHub Pages (dev)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/
          destination_dir: dev

  # Deploy stable docs to GitHub Pages (on tag push)
  deploy-stable:
    name: "deploy: Stable docs"
    needs: assemble-site
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download final site
        uses: actions/download-artifact@v4
        with:
          name: final-site
          path: docs/build/
      - name: Deploy to GitHub Pages (stable)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/
          destination_dir: stable

  # Deploy PR preview docs to GitHub Pages (on pull_request)
  deploy-preview:
    name: "deploy: PR preview docs"
    needs: assemble-site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download final site
        uses: actions/download-artifact@v4
        with:
          name: final-site
          path: docs/build/
      - name: Deploy to GitHub Pages (preview)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/
          destination_dir: preview/PR${{ github.event.pull_request.number }}
          keep_files: true
      - name: Post preview URL comment
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            📖 PR preview docs: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/PR${{ github.event.pull_request.number }}/
          comment_tag: preview-docs
