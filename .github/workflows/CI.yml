name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
jobs:
  test:
    name: ${{matrix.group}} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        group:
          - Core_Tests
          - Examples_1
          - Examples_2
          - Examples_3
          - Examples_4
          - WCSMO14_1
          - WCSMO14_2
          - Core_Tests_Opposite_Preference
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Set preference for opposite preference jobs
        if: contains(matrix.group, 'Opposite_Preference')
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            using Preferences
            # Set preference for TopOpt (UUID, name tuple format)
            Preferences.set_preferences!(
              (Base.UUID("a6e80f52-281a-4a51-a3c5-60a2513022d0"), "TopOpt"),
              "penalty_before_interpolation" => "false";
              force=true
            )
            println("Set penalty_before_interpolation to false")
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: ${{ matrix.group }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  # example for Makie-involving docs build
  # https://github.com/JuliaPlots/GLMakie.jl/blob/master/.github/workflows/ci.yml
  # https://github.com/JuliaPlots/GLMakie.jl/blob/master/.github/workflows/ci.yml
  # example for no-Makie-involving docs build
  # https://github.com/TuringLang/Turing.jl/blob/master/.github/workflows/Documentation.yml
  #
  # The docs build is split into two stages so example generation runs in
  # parallel across a matrix of shards, then a single deploy job merges the
  # generated artifacts and runs makedocs/deploydocs.
  docs-examples:
    name: docs examples (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: ['ubuntu-latest']
        total: [9]
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: docs
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.instantiate()
            Pkg.develop(PackageSpec(path=pwd()))'
      - name: Generate example shard
        env:
          DOCS_EXAMPLE_INDEX: ${{ matrix.shard }}
          DOCS_EXAMPLE_TOTAL: ${{ matrix.total }}
        run: julia --project=docs --color=yes -e 'include("docs/generate.jl")'
      - name: Upload generated examples
        uses: actions/upload-artifact@v4
        with:
          name: docs-examples-${{ matrix.shard }}
          path: docs/src/examples/
          if-no-files-found: error
          retention-days: 1
  docs:
    name: docs (build & deploy)
    needs: docs-examples
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        version: ['1']
        os: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: docs
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.instantiate()
            Pkg.develop(PackageSpec(path=pwd()))'
      - name: Download example shards
        uses: actions/download-artifact@v4
        with:
          pattern: docs-examples-*
          merge-multiple: true
          path: docs/src/examples
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCS_SKIP_GENERATE: 'true'
        run: julia --project=docs --color=yes docs/make.jl
