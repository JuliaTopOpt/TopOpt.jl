name: JET Report

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  jet-report:
    name: "JET: Report"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: pr

      - uses: actions/checkout@v6
        with:
          ref: master
          path: master

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64

      - uses: julia-actions/cache@v2
        with:
          cache-name: jet-report
          cache-artifacts: true
          cache-packages: true
          cache-compiled: true

      - name: Use General git registry
        run: |
          rm -rf ~/.julia/registries/General.toml ~/.julia/registries/General.tar.gz
          julia -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General.git"))'

      - name: Instantiate PR environment
        run: |
          julia --project=pr/test -e '
            using Pkg
            Pkg.develop(PackageSpec(path="pr"))
            Pkg.instantiate()
            Pkg.precompile()'

      - name: Instantiate master environment
        run: |
          julia --project=master/test -e '
            using Pkg
            Pkg.develop(PackageSpec(path="master"))
            Pkg.instantiate()
            Pkg.precompile()'

      - name: Run JET on PR branch
        run: julia --project=test test/jet_report.jl --output ../pr_jet.json
        working-directory: pr

      - name: Copy JET script to master checkout
        run: cp pr/test/jet_report.jl master/test/jet_report.jl

      - name: Run JET on master
        run: julia --project=test test/jet_report.jl --output ../master_jet.json
        working-directory: master

      - name: Compare JET reports
        run: julia --project=test test/jet_compare.jl ../master_jet.json ../pr_jet.json
        working-directory: pr

      - name: Compare JET reports (full, for master push)
        if: github.event_name == 'push'
        run: julia --project=test test/jet_compare.jl ../master_jet.json ../pr_jet.json --full
        working-directory: pr

      - name: Post JET comparison comment (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr/jet_diff.md', 'utf8');
            const tagged = body + '\n\n<!-- auto-pr-comment: jet-report -->';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const last = comments.data.pop();

            if (last && (last.body.includes('JET Report Comparison') || last.body.includes('<!-- auto-pr-comment: jet-report -->'))) {
              if (last.body === tagged) {
                console.log('Comment unchanged — skipping.');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: last.id,
                body: tagged,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: tagged,
              });
            }

      - name: Post JET report comment (push to master)
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr/jet_diff.md', 'utf8');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
