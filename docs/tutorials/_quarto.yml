project:
  type: website
  output-dir: _site

execute:
  enabled: false

website:
  title: "TopOpt.jl Tutorials"
  image: "../../assets/logo.png"
  navbar:
    background: light
    logo: "../../assets/logo.png"
    logo-alt: "TopOpt.jl logo"
    title: "Tutorials"
    right:
      - text: "Documentation"
        href: "../index.html"
        icon: book
      - icon: github
        href: "https://github.com/JuliaTopOpt/TopOpt.jl"

format:
  html:
    toc: true
    toc-location: right
    toc-floating: true
    embed-resources: true
    self-contained-math: true
    css: documenter-style.css
